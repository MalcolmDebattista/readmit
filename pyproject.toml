[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readmit"
version = "0.1.1"
description = "ARI3217 Task 26: 30-day readmission risk after discharge, packaged from the given notebook"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "rdflib>=7.0",
    "pyshacl>=0.26",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.15", "pandera>=0.30"]

[project.scripts]
readmit-fetch = "readmit.data:fetch_main"
readmit-train = "readmit.train:main"
readmit-check-data = "readmit.validate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# the notebook's code is kept unchanged (C2): its one-line `if ...: return`, `a; b` and the variable `l` stay
ignore = ["E701", "E702", "E741"]
